<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 수퍼마켓 8개 매장 인터랙티브 지도</title>
  <meta name="description" content="부산 지역 8대 수퍼마켓 브랜드 108개 매장의 위치 및 상세 정보를 한눈에 탐색하는 인터랙티브 지도 대시보드">

  <!-- Pretendard 웹폰트 (고해상도 프리미엄 타이포그래피) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Leaflet.js 무료 지도 라이브러리 CSS (OpenStreetMap 기반) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Leaflet MarkerCluster CSS (마커 클러스터링) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- 커스텀 스타일시트 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- 좌측 사이드바 패널 -->
    <aside class="sidebar" id="sidebar">
      
      <!-- 사이드바 상단 헤더 -->
      <header class="sidebar-header">
        <div class="brand-badge-header">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10"/>
          </svg>
          SHINSEGAE DATA LITERACY
        </div>

        <div class="header-title-row">
          <h1>
            <span>부산 수퍼마켓 지도</span>
          </h1>

          <div class="header-actions">
            <!-- 테마 토글 버튼 (라이트/다크) -->
            <button type="button" class="icon-btn" id="theme-toggle-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- 실시간 통계 배너 -->
        <div class="stats-banner">
          <div class="stat-item">
            <span>표시 중인 매장:</span>
            <span class="stat-value highlight" id="stat-current-count">0</span>
            <span>/</span>
            <span class="stat-value" id="stat-total-count">0</span>개
          </div>
          <button type="button" class="btn-secondary" id="reset-filters-btn" title="모든 필터 초기화">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            초기화
          </button>
        </div>
      </header>

      <!-- 검색 및 필터 컨트롤 -->
      <section class="filter-section">
        <!-- 텍스트 검색창 -->
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="상호명, 지점명, 도로명, 동 검색..." autocomplete="off">
          <button type="button" class="clear-search-btn" id="clear-search-btn" title="검색어 지우기">&times;</button>
        </div>

        <!-- 자치구 선택 -->
        <div class="filter-row">
          <select class="district-select" id="district-select" aria-label="자치구 필터">
            <option value="all">전체 자치구 (부산 전역)</option>
          </select>
        </div>

        <!-- 브랜드 칩스 (토글) -->
        <div class="brand-chips-label">
          <span>8대 브랜드 선택</span>
          <button type="button" id="toggle-all-brands-btn" style="background:none; border:none; color:var(--primary-accent); cursor:pointer; font-size:0.75rem; font-weight:700;">전체 반전</button>
        </div>
        <div class="brand-chips-grid" id="brand-chips-grid">
          <!-- JS에서 동적으로 칩스 렌더링 -->
        </div>
      </section>

      <!-- 스크롤 가능한 매장 카드 목록 -->
      <main class="store-list-container" id="store-list">
        <!-- JS에서 동적으로 카드 렌더링 -->
      </main>
    </aside>

    <!-- 우측 인터랙티브 지도 -->
    <div class="map-container">
      <div id="map"></div>

      <!-- 지도 위 플로팅 컨트롤 -->
      <div class="map-floating-controls">
        <button type="button" class="floating-btn" id="btn-reset-map" title="부산 전체 보기">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
          부산 전체
        </button>

        <button type="button" class="floating-btn" id="btn-my-location" title="내 위치 주변 보기">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          </svg>
          내 위치
        </button>
      </div>

      <!-- 지도 범례 (Legend) -->
      <div class="map-legend" id="map-legend">
        <div class="legend-title">브랜드 범례</div>
        <div class="legend-grid" id="legend-grid">
          <!-- JS에서 동적 생성 -->
        </div>
      </div>

      <!-- 모바일 목록 열기 토글 버튼 -->
      <button type="button" class="mobile-toggle-btn" id="mobile-toggle-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        매장 목록
      </button>
    </div>

  </div>

  <!-- 무료 오픈소스 지도 라이브러리 스크립트 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- 내장된 매장 데이터 (Zero-Upload 정책) -->
  <script src="stores-data.js"></script>

  <!-- 바닐라 자바스크립트 애플리케이션 로직 -->
  <script src="app.js"></script>
</body>
</html>
